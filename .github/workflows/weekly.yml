name: weekly-deep-quality

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-mutants --locked
      - name: Security-kernel mutation score
        env:
          MUTATION_TIMEOUT: 360
        run: tests/mutation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: mutants.out

  careful-and-miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install nightly --profile minimal --component miri --component rust-src
          cargo install cargo-careful --locked
      - name: Standard-library precondition checks
        run: tests/careful.sh
      - name: Miri on pure parser and budget tests
        run: |
          cargo +nightly miri test -p vapached --lib resource::tests::aggregate_spool_and_dynamic_limits_release_on_drop -- --exact
          cargo +nightly miri test -p vapached --lib http::tests::parse_basic -- --exact

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          cargo install cargo-cyclonedx --locked
          cargo install cargo-semver-checks --locked
      - name: Reproducible release binary
        run: tests/reproducible_build.sh
      - name: CycloneDX SBOM
        run: cargo cyclonedx --all --format json
      - name: Public API compatibility
        run: cargo semver-checks check-release --baseline-rev HEAD~1
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  vendored-h2-and-unsafe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Internal suite for the patched h2 fork
        # The vendored production tree intentionally omits upstream's large
        # JSON fixture corpus; strict h2spec exercises those wire behaviors.
        run: >-
          cargo test --manifest-path vendor/h2-0.4.20/Cargo.toml --lib --
          --skip hpack::test::fixture
      - name: Unsafe inventory
        run: python3 tests/unsafe_inventory.py
      - name: Algorithmic-complexity regression suite
        run: python3 tests/complexity_regressions.py

  performance-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Apache reference and benchmark client
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-utils
      - run: cargo build --locked --release -p vapached
      - name: Same-host differential throughput benchmark
        run: |
          python3 bench/bench.py --quick
          python3 tests/performance_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: bench/results/*.json
