name: linux-artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TARGET: x86_64-unknown-linux-musl

jobs:
  portable-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file rpm

      - name: Build and reproduce the complete release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "vapached"))')
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            packaging/run-reproducible-build.sh \
              --target "$TARGET" --output release
          binary="release/vapached-${version}-linux-x86_64-musl"
          file "$binary"
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "portable binary unexpectedly has dynamic dependencies" >&2
            exit 1
          fi
          "$binary" -v
          python3 tests/native_dependency_policy.py --binary "$binary"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Inspect package payloads
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --info release/*.deb
          deb_files=$(dpkg-deb --contents release/*.deb)
          printf '%s\n' "$deb_files"
          rpm -qip release/*.rpm
          rpm_files=$(rpm -qlp release/*.rpm)
          printf '%s\n' "$rpm_files"
          if printf '%s\n%s\n' "$deb_files" "$rpm_files" \
            | grep -Eq '(^|[[:space:].])/etc/(apache2|httpd)(/|$)'; then
            echo "package payload must not own Apache configuration" >&2
            exit 1
          fi
          (cd release && sha256sum --check SHA256SUMS)

      - name: Validate the Debian package on Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/release:/release:ro" \
            ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c \
            bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update >/dev/null
            apt-get install -y --no-install-recommends apache2 curl >/dev/null
            a2enmod ssl >/dev/null
            config_digest() {
              {
                find /etc/apache2 -xdev -printf "%P %y %m %u:%g %l\n" | sort
                find -L /etc/apache2 -xdev -type f -print0 \
                  | sort -z | xargs -0 sha256sum
              } | sha256sum | cut -d" " -f1
            }
            before=$(config_digest)
            dpkg -i /release/vapache_*.deb
            test "$before" = "$(config_digest)"
            test ! -e /etc/systemd/system/multi-user.target.wants/vapache.service
            if ! /usr/sbin/vapachectl configtest >/tmp/configtest.log 2>&1; then
              cat /tmp/configtest.log >&2
              exit 1
            fi
            test "$before" = "$(config_digest)"
            test -z "$(find /run/vapache/apache-config -type l -print -quit)"
            grep -qx "VapacheCapability AutoIndex On" \
              /run/vapache/apache-config/.vapache-capabilities.conf
            /usr/sbin/vapachectl foreground >/tmp/vapache.log 2>&1 &
            server_pid=$!
            cleanup() {
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            ready=0
            for attempt in $(seq 1 100); do
              if curl --noproxy "*" --fail --silent --show-error \
                http://127.0.0.1/ -o /tmp/served.html; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat /tmp/vapache.log >&2
                exit 1
              fi
              sleep 0.1
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/vapache.log >&2
              exit 1
            fi
            cmp /tmp/served.html /var/www/html/index.html
            test "$before" = "$(config_digest)"

            # An installed service must snapshot newly edited Apache policy,
            # retire the old request generation, and apply the replacement.
            printf "%s\n" \
              "<Location />" \
              "Require all denied" \
              "</Location>" \
              >/etc/apache2/conf-available/vapache-reload-test.conf
            ln -s ../conf-available/vapache-reload-test.conf \
              /etc/apache2/conf-enabled/vapache-reload-test.conf
            /usr/sbin/vapachectl graceful
            denied=0
            for attempt in $(seq 1 100); do
              status=$(curl --noproxy "*" --silent --output /dev/null \
                --write-out "%{http_code}" http://127.0.0.1/ || true)
              if [ "$status" = 403 ]; then
                denied=1
                break
              fi
              sleep 0.1
            done
            test "$denied" -eq 1

            printf "%s\n" \
              "<Location />" \
              "Require all granted" \
              "</Location>" \
              >/etc/apache2/conf-available/vapache-reload-test.conf
            /usr/sbin/vapachectl graceful
            granted=0
            for attempt in $(seq 1 100); do
              status=$(curl --noproxy "*" --silent --output /tmp/reloaded.html \
                --write-out "%{http_code}" http://127.0.0.1/ || true)
              if [ "$status" = 200 ] \
                  && cmp -s /tmp/reloaded.html /var/www/html/index.html; then
                granted=1
                break
              fi
              sleep 0.1
            done
            test "$granted" -eq 1
          '

      - name: Validate the RPM package on Rocky Linux 9
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/release:/release:ro" \
            rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6 \
            bash -c '
            set -euo pipefail
            mkdir -p /etc/httpd/conf /var/log/httpd /run/httpd \
              /usr/lib64/httpd/modules /var/www/html
            ln -s ../../var/log/httpd /etc/httpd/logs
            ln -s ../../run/httpd /etc/httpd/run
            ln -s ../../usr/lib64/httpd/modules /etc/httpd/modules
            printf "%s\n" \
              "ServerRoot /etc/httpd" \
              "Listen 127.0.0.1:18080" \
              "User nobody" \
              "Group nobody" \
              "DocumentRoot /var/www/html" \
              "<Directory /var/www/html>" \
              "Require all granted" \
              "</Directory>" \
              >/etc/httpd/conf/httpd.conf
            rpm -i /release/vapache-*.x86_64.rpm
            test "$(stat -c %U:%G:%a /usr/lib/vapache/control-common)" \
              = root:root:644
            /usr/sbin/vapachectl configtest
            test ! -e /run/vapache/apache-config
            grep -qx "PidFile /run/httpd/httpd.pid" \
              /run/vapache/apache-capabilities.conf
          '

      - name: Validate the stock Debian 13 SSL configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/release:/release:ro" \
            debian:13-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4 \
            bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update >/dev/null
            apt-get install -y --no-install-recommends apache2 curl openssl >/dev/null
            a2enmod ssl >/dev/null
            install -d -m 0700 \
              /etc/letsencrypt/archive/example.test \
              /etc/letsencrypt/live/example.test
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -subj /CN=example.test \
              -keyout /etc/letsencrypt/archive/example.test/privkey1.pem \
              -out /etc/letsencrypt/archive/example.test/fullchain1.pem \
              >/dev/null 2>&1
            chmod 0600 /etc/letsencrypt/archive/example.test/privkey1.pem
            ln -s ../../archive/example.test/fullchain1.pem \
              /etc/letsencrypt/live/example.test/fullchain.pem
            ln -s ../../archive/example.test/privkey1.pem \
              /etc/letsencrypt/live/example.test/privkey.pem
            printf "%s\n" \
              "<VirtualHost *:443>" \
              "ServerName example.test" \
              "DocumentRoot /var/www/html" \
              "SSLEngine On" \
              "SSLCertificateFile /etc/letsencrypt/live/example.test/fullchain.pem" \
              "SSLCertificateKeyFile /etc/letsencrypt/live/example.test/privkey.pem" \
              "<Directory /var/www/html>" \
              "Require all granted" \
              "</Directory>" \
              "</VirtualHost>" \
              >/etc/apache2/sites-available/vapache-certbot.conf
            a2ensite vapache-certbot >/dev/null
            dpkg -i /release/vapache_*.deb
            /usr/sbin/vapachectl configtest
            /usr/sbin/vapachectl foreground >/tmp/vapache-tls.log 2>&1 &
            server_pid=$!
            cleanup() {
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            ready=0
            for attempt in $(seq 1 100); do
              if curl --noproxy "*" --insecure --fail --silent \
                --resolve example.test:443:127.0.0.1 \
                https://example.test/ -o /tmp/served-tls.html; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat /tmp/vapache-tls.log >&2
                exit 1
              fi
              sleep 0.1
            done
            test "$ready" -eq 1
            cmp /tmp/served-tls.html /var/www/html/index.html
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -subj /CN=example.test \
              -keyout /etc/letsencrypt/archive/example.test/privkey2.pem \
              -out /etc/letsencrypt/archive/example.test/fullchain2.pem \
              >/dev/null 2>&1
            chmod 0600 /etc/letsencrypt/archive/example.test/privkey2.pem
            ln -s ../../archive/example.test/fullchain2.pem \
              /etc/letsencrypt/live/example.test/fullchain.pem.new
            ln -s ../../archive/example.test/privkey2.pem \
              /etc/letsencrypt/live/example.test/privkey.pem.new
            mv -Tf /etc/letsencrypt/live/example.test/fullchain.pem.new \
              /etc/letsencrypt/live/example.test/fullchain.pem
            mv -Tf /etc/letsencrypt/live/example.test/privkey.pem.new \
              /etc/letsencrypt/live/example.test/privkey.pem
            expected_fingerprint=$(openssl x509 \
              -in /etc/letsencrypt/archive/example.test/fullchain2.pem \
              -noout -fingerprint -sha256)
            /usr/sbin/vapachectl graceful
            rotated=0
            for attempt in $(seq 1 100); do
              presented_fingerprint=$(printf "" \
                | openssl s_client -connect 127.0.0.1:443 \
                    -servername example.test 2>/dev/null \
                | openssl x509 -noout -fingerprint -sha256)
              if [ "$presented_fingerprint" = "$expected_fingerprint" ]; then
                rotated=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat /tmp/vapache-tls.log >&2
                exit 1
              fi
              sleep 0.1
            done
            test "$rotated" -eq 1
          '

      - name: Validate Certbot's Apache installer against Vapache
        shell: bash
        run: tests/certbot_apache_integration.sh release/vapache_*.deb

      - name: Attest release provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/*

      - name: Upload binary and Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vapache-${{ steps.package.outputs.version }}-linux-x86_64-${{ github.sha }}
          path: |
            release/vapached-*-linux-x86_64-musl
            release/vapache-*-linux-x86_64-musl.tar.gz
            release/vapache_*.deb
            release/vapache-*.rpm
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish permanent release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          if [[ ! "$tag" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ "$tag" != "v$PACKAGE_VERSION" ]]; then
            echo "release tag $tag does not match crate/package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]]; then
            echo "checked-out commit does not match $tag" >&2
            exit 1
          fi

          assets=(
            release/vapached-*-linux-x86_64-musl
            release/vapache-*-linux-x86_64-musl.tar.gz
            release/vapache_*.deb
            release/vapache-*.rpm
            release/SHA256SUMS
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --verify-tag \
              --title "Vapache ${tag#v}" \
              --generate-notes \
              "${assets[@]}"
          fi
