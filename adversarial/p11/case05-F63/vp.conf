ServerRoot "/tmp/opencode/p11/case05-F63"
Listen 51899
User www-data
Group www-data
PidFile /tmp/opencode/p11/case05-F63/logs/httpd.pid
ErrorLog /tmp/opencode/p11/case05-F63/logs/error.log
LogLevel warn
ServerName localhost
TypesConfig /etc/mime.types
DocumentRoot "/tmp/opencode/p11/case05-F63/www"
Options +ExecCGI +FollowSymLinks
AddHandler cgi-script .cgi
<Directory "/tmp/opencode/p11/case05-F63/www">
    Require all granted
    AllowOverride All
</Directory>
<Directory "/tmp/opencode/p11/case05-F63/www">
    Require all granted
    <If "%{REQUEST_FILENAME} =~ /private/">
        Require all denied
    </If>
</Directory>
