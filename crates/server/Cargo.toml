[package]
name = "vapached"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
fuzzing = []
fault-injection = []

[[bin]]
name = "vapached"
path = "src/main.rs"

[dependencies]
vapache-verified = { path = "../verified", version = "0.1.0" }
vapache-pcre2 = { path = "../pcre2", version = "0.1.0" }
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
regex = "1.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
h2 = "0.4"
bytes = "1"
http = "1"
sha1 = "0.11"
ring = "0.17"
md-5 = "0.11"
base64 = "0.22"
bcrypt = "0.19"
flate2 = "1"
brotli = "8"
webpki-roots = "1"
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring", "std"] }

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
loom = "0.7"
proptest = "1.9"
