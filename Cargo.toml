[workspace]
resolver = "2"
members = [
    "crates/verified",
    "crates/server",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.99.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch.crates-io]
# The public h2 server adapter otherwise normalizes an absent `:path` to `/`
# and truncates a fragment before vapache can validate either pseudo-header.
h2 = { path = "vendor/h2-0.4.20" }
